<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" width="72" height="72" shape-rendering="crispEdges" role="img" aria-label="Flor em ponto cruz">
  <title>Laís Barroso</title>
  <!-- Flor em ponto cruz: cada quadrado é um ponto na grade,
       do mesmo jeito que um gráfico de bordado. -->
  <rect width="9" height="9" fill="#F3EBDD"/>

  <!-- pétala de cima -->
  <rect x="4" y="0" width="1" height="1" fill="#173BD5"/>
  <rect x="3" y="1" width="1" height="1" fill="#173BD5"/>
  <rect x="4" y="1" width="1" height="1" fill="#173BD5"/>
  <rect x="5" y="1" width="1" height="1" fill="#173BD5"/>

  <!-- pétala da esquerda -->
  <rect x="0" y="4" width="1" height="1" fill="#173BD5"/>
  <rect x="1" y="3" width="1" height="1" fill="#173BD5"/>
  <rect x="1" y="4" width="1" height="1" fill="#173BD5"/>
  <rect x="1" y="5" width="1" height="1" fill="#173BD5"/>

  <!-- pétala da direita -->
  <rect x="8" y="4" width="1" height="1" fill="#173BD5"/>
  <rect x="7" y="3" width="1" height="1" fill="#173BD5"/>
  <rect x="7" y="4" width="1" height="1" fill="#173BD5"/>
  <rect x="7" y="5" width="1" height="1" fill="#173BD5"/>

  <!-- pétala de baixo -->
  <rect x="4" y="8" width="1" height="1" fill="#173BD5"/>
  <rect x="3" y="7" width="1" height="1" fill="#173BD5"/>
  <rect x="4" y="7" width="1" height="1" fill="#173BD5"/>
  <rect x="5" y="7" width="1" height="1" fill="#173BD5"/>

  <!-- folhas nas diagonais -->
  <rect x="2" y="2" width="1" height="1" fill="#063D27"/>
  <rect x="6" y="2" width="1" height="1" fill="#063D27"/>
  <rect x="2" y="6" width="1" height="1" fill="#063D27"/>
  <rect x="6" y="6" width="1" height="1" fill="#063D27"/>

  <!-- miolo -->
  <rect x="4" y="3" width="1" height="1" fill="#B95437"/>
  <rect x="3" y="4" width="1" height="1" fill="#B95437"/>
  <rect x="4" y="4" width="1" height="1" fill="#E5A080"/>
  <rect x="5" y="4" width="1" height="1" fill="#B95437"/>
  <rect x="4" y="5" width="1" height="1" fill="#B95437"/>
</svg>
